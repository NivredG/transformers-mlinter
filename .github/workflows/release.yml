name: Release

on:
  push:
    tags:
      - v*
    branches:
      - "v*-release"

jobs:
  build_and_test:
    name: build release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/ -v
      - run: make build-release

      - run: python -m pip uninstall -y transformers-mlinter
      - run: python -m pip install dist/*.whl

      - run: mlinter --version
      - run: cd /tmp && python -m mlinter --version
      - run: cd /tmp && python -c "import mlinter; assert mlinter.__version__; assert 'TRF001' in mlinter.TRF_RULES"

      - run: python -m twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-dist
          path: |
            dist/**
            build/**

  upload_package:
    needs: build_and_test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-dist
          path: .

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          verbose: true
